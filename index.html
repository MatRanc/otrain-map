<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>O-Train Live</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
  html, body, #map { height: 100%; margin: 0; }
  /* No page pinch/double-tap zoom on the UI; the map handles its own gestures. */
  html, body { touch-action: none; overscroll-behavior: none; }
  body { font-family: "Open Sans", system-ui, sans-serif; color: #222; background: #f2efe9; }
  .card { position: absolute; z-index: 2; top: 12px; left: 12px; background: #fff; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 12px 14px; max-width: calc(100vw - 52px); }
  .card h1 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
  .legend > span { display: flex; align-items: center; gap: 5px; }
  .status { margin-top: 8px; font-size: 12px; color: #555; }
  .note { margin-top: 4px; font-size: 12px; color: #595959; max-width: 240px; }
  .toggle { display: flex; align-items: center; gap: 8px; padding: 6px 2px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  /* Layers button: MapLibre control group in the bottom-right, panel opens to its left. */
  .layers { position: relative; }
  .layers > button svg { width: 18px; height: 18px; margin: auto; display: block; }
  .layers-panel { position: absolute; right: calc(100% + 8px); bottom: 0; background: #fff; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.2); padding: 6px 12px; }
  .layers-panel[hidden] { display: none; }
  /* Info card collapses to title + status (closed by default on phones). */
  .card summary { list-style: none; cursor: pointer; }
  .card summary::-webkit-details-marker { display: none; }
  .card summary h1 { display: flex; align-items: center; gap: 8px; }
  .card summary h1::after { content: ""; width: 7px; height: 7px; border: solid #555; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-2px); transition: transform .15s; }
  .card details[open] summary h1::after { transform: rotate(-135deg) translateY(-2px); }
  .card summary .status { margin-top: 0; }
  .card details[open] summary { margin-bottom: 8px; }
  @media (max-width: 640px) { .card { padding: 10px 12px; } .card h1 { font-size: 16px; } }
  .badge { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 16px;
    display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); box-sizing: border-box; }
  .legend .badge { width: 22px; height: 22px; font-size: 13px; }
  .stn { background: #fff; border: 2.5px solid #222; border-radius: 99px; box-sizing: border-box; }
  /* --len is set from the zoom level. */
  .train { width: var(--len, 34px); aspect-ratio: 100 / 24; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,.45)); cursor: pointer; }
  .train svg { display: block; width: 100%; height: 100%; }
  .three .train svg { opacity: 0; } /* 3D models draw the train; the flat marker stays as the tap target */
  .three .train { filter: none; }
  /* The model stands taller than the flat marker it sits on, so widen the tap target across the train. */
  .three .train::before { content: ""; position: absolute; inset: calc(var(--len, 34px) * -0.4) -4px; }
  .alert { margin-top: 8px; padding-left: 8px; border-left: 3px solid var(--c); font-size: 13px; max-width: 260px; }
  .alert a { color: inherit; font-weight: 600; }
  .bus { padding: 1px 5px; border-radius: 4px; background: var(--c); color: #fff; font-size: 11px; font-weight: 700;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); cursor: pointer; }
  .maplibregl-popup { font-family: inherit; font-size: 13px; pointer-events: none; }
  .maplibregl-popup-content { padding: 6px 10px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="card">
  <details id="info" open>
    <summary><h1>O-Train Live</h1><div class="status" id="status" role="status">Loading…</div></summary>
    <div class="legend" id="legend"></div>
    <div class="note">Positions follow the timetable. OC Transpo doesn't publish live O-Train locations.</div>
    <div class="note">If part of a line is down, it turns grey and dashed, its trains disappear, and the live R1/R2/R4 replacement buses take their place.</div>
  </details>
  <div id="alerts"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// OC Transpo's GTFS-RT feeds (see worker.js) carry buses only, no O-Train, so trains follow the published timetable.
const DWELL_S = 12; // GTFS lists arrival == departure; hold trains this long so they visibly stop
// What *is* live: R1/R2/R4 replacement buses (= that stretch of line is down) and O-Train RSS alerts, via the Worker.
// ?feed=<url> overrides it for testing.
const FEED = new URLSearchParams(location.search).get("feed") || "https://otrain-feed.otrain-map.workers.dev";
const POLL_MS = 60000;
const YARD_MS = 12; // m/s (~45 km/h) running empty to the yard after a train's last trip
let sched, LINES, DEPOTS, lastRun;

const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty",
  center: [-75.69, 45.37], zoom: 10.5, attributionControl: false });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
map.addControl(new maplibregl.AttributionControl({ customAttribution: "Data: OC Transpo", compact: true }));
// MapLibre opens the compact credits on load; on phones that box covers the south end of Line 2, so start it closed (the ⓘ opens it).
map.once("load", () => { if (matchMedia("(max-width: 640px)").matches) document.querySelector(".maplibregl-ctrl-attrib")?.classList.remove("maplibregl-compact-show"); });

// Trains grow a little as you zoom in, but stay a symbol (34–60 px), not to scale.
const sizeTrains = () => map.getContainer().style.setProperty("--len", `${Math.min(60, Math.max(34, 34 + (map.getZoom() - 12) * 8))}px`);
map.on("zoom", sizeTrains);
sizeTrains();


// One shared popup: hover shows it; clicking a train pins it (it follows the train) until you click elsewhere.
// subpixelPositioning: a pinned popup glides with its train instead of stepping a whole pixel at a time.
const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12, subpixelPositioning: true });
let pinned = null; // train id whose popup is pinned
const hover = (el, getLngLat, getHtml) => {
  el.addEventListener("mouseenter", () => { if (pinned == null) popup.setLngLat(getLngLat()).setHTML(getHtml()).addTo(map); });
  el.addEventListener("mouseleave", () => { if (pinned == null) popup.remove(); });
};
const unpin = () => { pinned = null; popup.remove(); };
map.on("click", unpin); // marker clicks stop propagation, so this only fires for the map itself

const div = (cls, html = "") => Object.assign(document.createElement("div"), { className: cls, innerHTML: html });
const ll = ([la, lo]) => [lo, la];

// Layers button (added after the nav control, so it stacks above it).
map.addControl({
  onAdd() {
    const el = div("maplibregl-ctrl maplibregl-ctrl-group layers", `
      <button type="button" aria-label="Map layers" aria-expanded="false" title="Map layers">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 16 10 5 10-5"/></svg>
      </button>
      <div class="layers-panel" hidden>
        <label class="toggle"><input type="checkbox" id="sat"> Satellite</label>
        <label class="toggle"><input type="checkbox" id="three"> 3D view</label>
      </div>`);
    const btn = el.querySelector("button"), panel = el.querySelector(".layers-panel");
    const show = (on) => { panel.hidden = !on; btn.setAttribute("aria-expanded", on); };
    btn.addEventListener("click", () => show(panel.hidden));
    document.addEventListener("click", (e) => { if (!el.contains(e.target)) show(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") show(false); });
    return el;
  },
  onRemove() {},
}, "bottom-right");

// iOS Safari ignores user-scalable=no; cancelling its gesture events stops page zoom (map pinch uses touch events, unaffected).
for (const t of ["gesturestart", "gesturechange"]) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });

const card = document.querySelector(".card"), phone = matchMedia("(max-width: 640px)");
document.getElementById("info").open = !phone.matches; // phones start with the info card collapsed

// Checkbox remembered per viewer; apply(on) runs now and on change.
const pref = (id, def, apply) => {
  const el = document.getElementById(id);
  try { const v = localStorage.getItem(id); if (v) el.checked = v === "1"; else el.checked = def; } catch { el.checked = def; }
  const go = () => { apply(el.checked); try { localStorage.setItem(id, el.checked ? "1" : "0"); } catch {} };
  el.addEventListener("change", go);
  return go;
};
const applySat = pref("sat", false, (on) => {
  if (!map.getLayer("sat")) return;
  // Satellite imagery already shows the buildings, so drop the basemap's 3D extrusions while it's on.
  for (const l of map.getStyle().layers) if (l.id === "sat" || l.type === "fill-extrusion")
    map.setLayoutProperty(l.id, "visibility", (l.id === "sat") === on ? "visible" : "none");
});
// Whole network in view; in 3D rotated and tilted. cameraForBounds can't account for tilt, so measure where the
// lines land on screen and correct zoom + centre (damped passes, all before the next paint), then ease there.
let homeBounds, homePts, touched = false;
function homeView(duration = 0) {
  const on = document.body.classList.contains("three"), bearing = on ? -17 : 0, pitch = on ? 60 : 0;
  const pad = phone.matches ? { top: card.offsetHeight + 20, bottom: 20, left: 20, right: 56 } // clear the card and controls
    : { top: 60, bottom: 30, left: 30, right: 30 };
  const { clientWidth: W, clientHeight: H } = map.getContainer(), aw = W - pad.left - pad.right, ah = H - pad.top - pad.bottom;
  const cam = map.cameraForBounds(homeBounds, { bearing, padding: pad });
  if (!cam || aw <= 0 || ah <= 0) return;
  const start = { center: map.getCenter(), zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() };
  let { center, zoom } = cam;
  for (let i = 0; i < 8; i++) {
    map.jumpTo({ center, zoom, bearing, pitch });
    const ps = homePts.map((p) => map.project(p)), xs = ps.map((p) => p.x), ys = ps.map((p) => p.y);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    center = map.unproject([W / 2 + (x0 + x1) / 2 - (pad.left + aw / 2), H / 2 + (y0 + y1) / 2 - (pad.top + ah / 2)]);
    zoom += 0.6 * Math.log2(Math.min(aw / (x1 - x0), ah / (y1 - y0))); // damped: under tilt the fit isn't linear in zoom
  }
  map.jumpTo(start);
  map.easeTo({ center, zoom, bearing, pitch, duration });
}

// 3D view: tilt the camera and draw trains as three.js models (three.js loads the first time it's switched on).
const applyThree = pref("three", false, async (on) => {
  document.body.classList.toggle("three", on);
  if (!LINES) return; // runs again once the map and lines are ready
  if (touched) map.easeTo({ pitch: on ? 60 : 0, bearing: on ? -17 : 0, duration: 900 }); // keep the viewer's spot
  else homeView(900);
  if (on && !map.getLayer("trains-3d")) map.addLayer(await trainLayer());
});


Promise.all([fetch("lines.json").then((r) => r.json()), fetch("depots.json").then((r) => r.json()), map.once("load")]).then(([lines, depots]) => {
  DEPOTS = depots;
  // The style draws flat buildings only at zoom 13–14, then 3D from 14: drop the flat band and start 3D at 13.
  if (map.getLayer("building")) map.removeLayer("building");
  if (map.getLayer("building-3d")) map.setLayerZoomRange("building-3d", 13, 24);
  // Satellite sits above the basemap's fills/roads but under its labels, so place names stay readable.
  map.addSource("sat", { type: "raster", tileSize: 256, maxzoom: 19, attribution: "Imagery &copy; Esri",
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"] });
  map.addLayer({ id: "sat", type: "raster", source: "sat", layout: { visibility: "none" } },
    map.getStyle().layers.find((x) => x.type === "symbol")?.id);
  applySat();
  for (const l of lines) {
    measure(l);
    map.addSource(l.route_id, { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: l.shape.map(ll) } } });
    map.addLayer({ id: l.route_id + "-casing", type: "line", source: l.route_id, layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#fff", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 16, 14] } });
    map.addLayer({ id: l.route_id, type: "line", source: l.route_id, layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": l.color, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4, 16, 9] } });
    // Section replaced by buses: grey dashes over the line, empty until poll() finds R-buses.
    map.addSource(l.route_id + "-down", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: l.route_id + "-down", type: "line", source: l.route_id + "-down", layout: { "line-join": "round" },
      paint: { "line-color": "#6b7075", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4, 16, 9], "line-dasharray": [1.5, 1] } });
    document.getElementById("legend").insertAdjacentHTML("beforeend",
      `<span><span class="badge" style="background:${l.color}">${l.name}</span>Line ${l.name}</span>`);
  }
  // Yellow route ahead of each train running to its yard (frame() fills it), with a dark edge so it reads on the light basemap.
  // It sits under the coloured lines, as wide as their white casing, so on the main line it shows as a yellow border.
  map.addSource("to-yard", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "to-yard-casing", type: "line", source: "to-yard", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": "rgba(0,0,0,.45)", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 9, 16, 17] } }, lines[0].route_id);
  map.addLayer({ id: "to-yard", type: "line", source: "to-yard", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": "#ffd21f", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 16, 14] } }, lines[0].route_id);
  for (const l of lines) map.moveLayer(l.route_id + "-casing", "to-yard-casing"); // every white casing below it
  for (const l of lines) l.sd = l.stations.map((s) => project(l, s.lat, s.lon)); // station distance along the line
  const seen = new Set();
  for (const l of lines) {
    for (const s of l.stations) {
      if (seen.has(s.name)) continue; // shared stations (Bayview, South Keys) drawn once
      seen.add(s.name);
      const el = div("stn");
      [el.style.width, el.style.height] = l.name === "1" ? ["24px", "11px"] : ["15px", "15px"]; // Line 1 pills, like OC Transpo's map
      new maplibregl.Marker({ element: el }).setLngLat([s.lon, s.lat]).addTo(map);
      hover(el, () => [s.lon, s.lat], () => s.name);
    }
    for (const end of [l.stations[0], l.stations.at(-1)]) {
      new maplibregl.Marker({ element: div("", `<div class="badge" style="background:${l.color}">${l.name}</div>`), offset: [0, -19] })
        .setLngLat([end.lon, end.lat]).addTo(map);
    }
  }
  const b = new maplibregl.LngLatBounds();
  lines.forEach((l) => l.shape.forEach((p) => b.extend(ll(p))));
  homeBounds = b;
  homePts = lines.flatMap((l) => l.shape.filter((_, i) => i % 4 === 0).concat([l.shape.at(-1)]).map(ll));
  homeView();
  // A tab opened in the background has no size yet, so the first fit is wrong: refit on resize until the viewer moves the map.
  map.on("movestart", (e) => { if (e.originalEvent) touched = true; });
  map.on("resize", () => { if (!touched) homeView(); });
  return fetch("schedule.json").then((r) => r.json()).then((s) => {
    sched = s; LINES = lines;
    lastRun = new Map(); // train -> its last trip of the service day
    for (const r of s.trips) if (!lastRun.has(r[3]) || r.at(-2) > lastRun.get(r[3]).at(-2)) lastRun.set(r[3], r);
    requestAnimationFrame(frame); poll(); applyThree(); });
});

// Track geometry: flat-earth metres are plenty at city scale.
const KX = 111320 * Math.cos(45.4 * Math.PI / 180), KY = 110540;
function measure(l) {
  l.xy = l.shape.map(([la, lo]) => [lo * KX, la * KY]);
  l.cum = [0];
  for (let i = 1; i < l.xy.length; i++) l.cum.push(l.cum[i - 1] + Math.hypot(l.xy[i][0] - l.xy[i - 1][0], l.xy[i][1] - l.xy[i - 1][1]));
  l.length = l.cum.at(-1);
}
function project(l, lat, lon) { // -> distance along the line of the nearest point
  const px = lon * KX, py = lat * KY;
  let best = Infinity, d = 0;
  for (let i = 1; i < l.xy.length; i++) {
    const [ax, ay] = l.xy[i - 1], [bx, by] = l.xy[i], dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
    const e = (ax + t * dx - px) ** 2 + (ay + t * dy - py) ** 2;
    if (e < best) { best = e; d = l.cum[i - 1] + t * (l.cum[i] - l.cum[i - 1]); }
  }
  return d;
}
function pointAt(l, d) { // -> [lon, lat]; binary search: called several times per train every frame
  let lo = 1, hi = l.cum.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (l.cum[mid] < d) lo = mid + 1; else hi = mid; }
  const i = lo;
  const t = (d - l.cum[i - 1]) / (l.cum[i] - l.cum[i - 1] || 1), [a, b] = [l.shape[i - 1], l.shape[i]];
  return [a[1] + t * (b[1] - a[1]), a[0] + t * (b[0] - a[0])];
}

// Top-down Citadis-ish train pointing right: white body, dark windshield + headlights up front, line-colour stripe.
const trainSvg = (c) => `<svg viewBox="0 0 100 24" aria-hidden="true">
  <path d="M5 2H82Q98 4 99 12Q98 20 82 22H5Q1 22 1 18V6Q1 2 5 2Z" fill="#fff" stroke="#2b2b2b" stroke-width="1"/>
  <path d="M86 4.6Q96.5 6.5 97 12Q96.5 17.5 86 19.4Q89.5 12 86 4.6Z" fill="#1d232b"/>
  <path d="M74 2.2Q82 2.6 86 4.6M74 21.8Q82 21.4 86 19.4" stroke="#d30f1d" stroke-width="2.2" fill="none"/>
  <circle cx="95" cy="7.5" r="1.3" fill="#ffd54a"/><circle cx="95" cy="16.5" r="1.3" fill="#ffd54a"/>
  <rect x="5" y="10.5" width="72" height="3" rx="1.5" fill="${c}"/>
  <path d="M26 2.5V21.5M50 2.5V21.5" stroke="#555" stroke-width="1"/>
  <rect x="35" y="6" width="8" height="3" rx="1" fill="#9aa0a6"/><rect x="2.2" y="7" width="1.6" height="10" rx=".8" fill="#d30f1d"/>
</svg>`;

const trains = new Map(); // train id -> { marker, info }

// Ottawa wall-clock: service date (YYYYMMDD), weekday (0 = Monday) and seconds since midnight.
const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", weekday: "short" });
function ottawa(ms) {
  const p = Object.fromEntries(fmt.formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
  return { date: p.year + p.month + p.day, wd: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].indexOf(p.weekday), sec: +p.hour * 3600 + +p.minute * 60 + +p.second };
}
function running(day) { // service indices running on that Ottawa day
  return new Set(sched.service_ids.map((id, i) => [id, i]).filter(([id]) => {
    const c = sched.services[id];
    if (c.remove.includes(day.date)) return false;
    return c.add.includes(day.date) || (c.days[day.wd] === "1" && c.start <= day.date && day.date <= c.end);
  }).map(([, i]) => i));
}

// Where a trip is at time t (seconds after its service day's midnight), or null if not running.
const ease = (f) => f * f * (3 - 2 * f); // accelerate out of a station, brake into the next
function locate(row, t) {
  const n = (row.length - 4) / 3, l = LINES[row[0]], at = (i, k) => row[4 + i * 3 + k]; // row: line, dir, service, train, stops…
  if (t < at(0, 1) - 60 || t > at(n - 1, 2) + 30) return null; // appear a minute early at the terminus, linger 30 s
  const meta = { done: t > at(n - 1, 1), start: at(0, 1) }; // used to pick one trip per physical train
  for (let i = 0; i < n; i++) {
    const arr = at(i, 1), dep = at(i, 2) + DWELL_S;
    if (t <= dep || i === n - 1) return { l, d: l.sd[at(i, 0)], i, stopped: true, next: i, sign: i < n - 1 && l.sd[at(i + 1, 0)] < l.sd[at(i, 0)] ? -1 : 1, eta: i < n - 1 ? at(i, 2) : arr, ...meta }; // at a station: its departure time
    const nArr = at(i + 1, 1);
    if (t < nArr) {
      const a = l.sd[at(i, 0)], b = l.sd[at(i + 1, 0)], f = (t - dep) / Math.max(1, nArr - dep);
      return { l, d: a + (b - a) * ease(Math.min(1, Math.max(0, f))), i, stopped: false, next: i + 1, sign: b < a ? -1 : 1, eta: nArr, ...meta };
    }
  }
  return null;
}

// After its last trip a train runs empty from where it ended, along the line and the yard track (depots.json), into its yard.
// Line 4 has no yard: its trains run up Line 2 to Walkley. The route is a pseudo-line, so pointAt and the 3D models just work.
const yardPaths = {};
function yardPath(row) {
  const l = LINES[row[0]], end = l.sd[row.at(-3)], key = row[0] + ":" + end;
  if (yardPaths[key]) return yardPaths[key];
  const l2 = LINES.find((x) => x.name === "2"), dep = DEPOTS[l.name === "4" ? "2" : l.name], yard = dep.path;
  const at = (x, name) => x.sd[x.stations.findIndex((s) => s.name === name)];
  const run = ([x, a, b]) => a <= b ? slice(x, a, b) : slice(x, b, a).reverse();
  const legs = l.name === "4" ? [[l, end, at(l, "South Keys")], [l2, at(l2, "South Keys"), project(l2, ...yard[0])]] : [[l, end, project(l, ...yard[0])]];
  const p = { name: l.name, color: l.color, yard: dep.name, shape: [...legs.flatMap(run).map(ll), ...yard] };
  measure(p);
  return (yardPaths[key] = p);
}
function toYard(row, t) {
  const p = yardPath(row), s = t - (row.at(-1) + 30); // locate() lingers 30 s at the last stop
  return s >= 0 && s <= p.length / YARD_MS ? { l: p, d: p.length * ease(s * YARD_MS / p.length), sign: 1, yard: true } : null;
}

const down = {}; // route_id -> [from, to] metres along the line where R-buses are replacing trains
const buses = new Map(); // vehicle id -> { marker, at: [lon, lat], to: [lon, lat] }
async function poll() {
  try {
    const r = await fetch(FEED, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const { vehicles, alerts } = await r.json();
    document.getElementById("alerts").innerHTML = alerts.map((a) => {
      const l = LINES.find((x) => a.lines.includes(x.name)) || LINES[0];
      const esc = (t) => t.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
      return `<div class="alert" style="--c:${l.color}"><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a></div>`;
    }).join("");
    const spans = {}, ids = new Set();
    for (const v of vehicles.filter((v) => /^R[124]$/.test(v.route_id))) {
      const l = LINES.find((x) => x.name === v.route_id[1]);
      if (!l) continue;
      ids.add(v.id);
      let b = buses.get(v.id);
      if (!b) {
        const el = div("bus", v.route_id);
        el.style.setProperty("--c", l.color);
        b = { at: [v.lon, v.lat], marker: new maplibregl.Marker({ element: el, subpixelPositioning: true }).setLngLat([v.lon, v.lat]).addTo(map) };
        hover(el, () => b.marker.getLngLat(), () => `<b>${v.route_id}</b> replacement bus<br>Trains not running here`);
        buses.set(v.id, b);
      }
      b.to = [v.lon, v.lat];
      // Buses follow roads near the line; only count ones within 1.5 km of it.
      const d = project(l, v.lat, v.lon), [x, y] = pointAt(l, d);
      if (Math.hypot((x - v.lon) * KX, (y - v.lat) * KY) > 1500) continue;
      const sp = (spans[l.route_id] ||= [d, d]);
      sp[0] = Math.min(sp[0], d); sp[1] = Math.max(sp[1], d);
    }
    for (const [id, b] of buses) if (!ids.has(id)) { b.marker.remove(); buses.delete(id); }
    for (const l of LINES) {
      const sp = spans[l.route_id];
      // ponytail: section = stations just outside the buses' spread; a single bus only marks the stretch around it.
      down[l.route_id] = sp && [Math.max(0, ...l.sd.filter((x) => x <= sp[0])), Math.min(l.length, ...l.sd.filter((x) => x >= sp[1]))];
      map.getSource(l.route_id + "-down").setData(down[l.route_id]
        ? { type: "Feature", geometry: { type: "LineString", coordinates: slice(l, ...down[l.route_id]) } }
        : { type: "FeatureCollection", features: [] });
    }
  } catch (e) {
    console.warn("[otrain] live check failed:", e.message); // timetable keeps running without it
  }
  setTimeout(poll, POLL_MS);
}
function slice(l, a, b) { // line coordinates between two distances
  return [pointAt(l, a), ...l.shape.filter((_, i) => l.cum[i] > a && l.cum[i] < b).map(ll), pointAt(l, b)];
}

const hhmm = (s) => `${Math.floor(s / 3600) % 24}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}`;
let lastScan = 0, today, yesterday, stale, yardDrawn = 0;
function frame() {
  const nowMs = Date.now(), now = ottawa(nowMs);
  if (nowMs - lastScan > 60000) { // service calendars only change at midnight
    lastScan = nowMs;
    today = running(now);
    yesterday = running(ottawa(nowMs - 86400000)); // after-midnight trips belong to yesterday's service (times > 24:00)
    stale = Object.values(sched.services).every((c) => c.end < now.date && !c.add.some((d) => d >= now.date));
  }
  const t = now.sec + (nowMs % 1000) / 1000, seen = new Set(), best = new Map();
  for (const row of sched.trips) {
    const pos = (today.has(row[2]) && locate(row, t)) || (yesterday.has(row[2]) && locate(row, t + 86400));
    if (!pos) continue;
    const dn = down[pos.l.route_id];
    if (dn && pos.d >= dn[0] - 50 && pos.d <= dn[1] + 50) continue; // buses replacing trains here
    // At a terminus one train can have two trips live (one arriving, its next one about to leave): show the one still running.
    const cur = best.get(row[3]);
    if (!cur || (cur.pos.done && !pos.done) || (cur.pos.done === pos.done && pos.start < cur.pos.start)) best.set(row[3], { row, pos });
  }
  let inYard = 0;
  const toYardLines = [];
  for (const [k, row] of lastRun) {
    if (best.has(k)) continue;
    const pos = (today.has(row[2]) && toYard(row, t)) || (yesterday.has(row[2]) && toYard(row, t + 86400));
    if (!pos) continue;
    // ponytail: hidden through a closed section like the in-service trains; Line 4 runs on Line 2 track, so not checked.
    const l = LINES[row[0]], dn = down[l.route_id];
    if (dn) {
      const [lo, la] = pointAt(pos.l, pos.d), d = project(l, la, lo), [x, y] = pointAt(l, d);
      if (d >= dn[0] - 50 && d <= dn[1] + 50 && Math.hypot((x - lo) * KX, (y - la) * KY) < 50) continue; // on the line, in the gap
    }
    best.set(k, { row, pos }); inYard++;
    toYardLines.push(slice(pos.l, pos.d, pos.l.length));
  }
  for (const [k, { row, pos }] of best) { // k = physical train, so its marker carries over when it turns around
    seen.add(k);
    let tr = trains.get(k);
    if (!tr) {
      const el = div("train", trainSvg(pos.l.color));
      el.title = `Line ${pos.l.name} train`;
      // subpixelPositioning: no 1px stepping when a train crawls across the screen at city zoom.
      tr = { marker: new maplibregl.Marker({ element: el, rotationAlignment: "map", pitchAlignment: "map", subpixelPositioning: true }).setLngLat(pointAt(pos.l, pos.d)).addTo(map) };
      hover(el, () => tr.marker.getLngLat(), () => tr.info);
      el.addEventListener("click", (e) => { e.stopPropagation(); pinned = k; popup.setLngLat(tr.marker.getLngLat()).setHTML(tr.info).addTo(map); });
      trains.set(k, tr);
    }
    const here = pointAt(pos.l, pos.d), ahead = pointAt(pos.l, pos.d + pos.sign * 30);
    tr.marker.setLngLat(here);
    // Sprite points east; marker rotation is clockwise from north.
    const dx = (ahead[0] - here[0]) * KX, dy = (ahead[1] - here[1]) * KY;
    if (dx || dy) tr.marker.setRotation(Math.atan2(dx, dy) * 180 / Math.PI - 90);
    Object.assign(tr, { l: pos.l, here, d: pos.d, sign: pos.sign });
    tr.info = pos.yard ? `<b>Line ${pos.l.name}, not in service</b><br>Heading to ${pos.l.yard}`
      : `<b>Line ${pos.l.name} to ${pos.l.headsigns[row[1]]}</b><br>${pos.stopped ? "At" : "Next:"} ${pos.l.stations[row[4 + pos.next * 3]].name}<br><small>Scheduled for ${hhmm(pos.eta)}</small>`;
  }
  for (const [k, tr] of trains) if (!seen.has(k)) { tr.marker.remove(); trains.delete(k); }
  if (toYardLines.length || yardDrawn) { // every frame so the tail stays under the train; nothing to send when no train is yard-bound
    yardDrawn = toYardLines.length;
    map.getSource("to-yard").setData({ type: "FeatureCollection",
      features: toYardLines.map((c) => ({ type: "Feature", geometry: { type: "LineString", coordinates: c } })) });
  }
  if (pinned != null) { // keep the pinned popup on its train; drop it when the train leaves service
    const tr = trains.get(pinned);
    if (!tr) unpin();
    else { popup.setLngLat(tr.marker.getLngLat()); if (tr.info !== tr.shown) popup.setHTML((tr.shown = tr.info)); }
  }
  for (const b of buses.values()) { // glide to each new GPS fix instead of jumping
    b.at = b.at.map((x, i) => x + (b.to[i] - x) * 0.02);
    b.marker.setLngLat(b.at);
  }
  const status = document.getElementById("status");
  const downLines = LINES.filter((l) => down[l.route_id]).map((l) => `Line ${l.name}`);
  const live = seen.size - inYard;
  status.textContent = stale ? "Timetable out of date: rerun build_lines.py" : (live ? `${live} train${live === 1 ? "" : "s"} on the timetable right now` : "No trains scheduled right now")
    + (inYard ? ` · ${inYard} heading to the yard` : "") + (downLines.length ? ` · replacement buses on ${downLines.join(", ")}` : "");
  if (document.body.classList.contains("three")) map.triggerRepaint(); // the 3D layer redraws trains every frame
  requestAnimationFrame(frame);
}

// three.js custom layer: one low-poly train per physical train, in metres around the map centre (keeps float32 precise).
async function trainLayer() {
  const THREE = await import("https://unpkg.com/three@0.160.0/build/three.module.js");
  const scene = new THREE.Scene(), camera = new THREE.Camera(), groups = new Map();
  scene.add(new THREE.AmbientLight(0xffffff, 1.8));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-0.6, -1, 2); // from the south-west, above
  scene.add(sun);
  const mat = (c) => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide }); // DoubleSide: the y-flip mirrors faces
  const white = mat(0xf2f2f2), glass = mat(0x1d232b), red = mat(0xd30f1d), grey = mat(0x8a9096);
  // ponytail: every line uses the Citadis model for now; Lines 2/4 run Stadler FLIRTs (81 m), a separate model later.
  const LEN = { 1: 98, 2: 81, 4: 81 }; // metres
  // Model axes: x = forward, y = left, z = up. Geometry is built once per line and shared by every train.
  const W = 2.65, BASE = 0.5, TOP = 3.5; // metres: car width, floor and roof height
  const placed = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); return o; };
  const box = (lx, ly, lz) => new THREE.BoxGeometry(lx, ly, lz);
  // Car body: rounded-rectangle cross-section (rounded roof edges, like the Citadis) extruded along x.
  function bodyGeo(len) {
    const r = 0.55, h = TOP - BASE, sh = new THREE.Shape();
    sh.moveTo(-W / 2, 0); sh.lineTo(W / 2, 0); sh.lineTo(W / 2, h - r); sh.quadraticCurveTo(W / 2, h, W / 2 - r, h);
    sh.lineTo(-W / 2 + r, h); sh.quadraticCurveTo(-W / 2, h, -W / 2, h - r); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: len, bevelEnabled: false, curveSegments: 4 });
    return g.applyMatrix4(new THREE.Matrix4().set(0, 0, 1, -len / 2, 1, 0, 0, 0, 0, 1, 0, BASE, 0, 0, 0, 1)); // (x,y,z) -> (z, x, y)
  }
  // Cab nose, side profile (x forward from the body end, z up): curved and sloped, split into bands like the real
  // livery: red lower nose, black wraparound windshield, white roof cap. Extruded across the width with rounded edges.
  const FRONT = [[2.25, 0.5], [2.55, 0.85], [2.7, 1.4], [2.6, 2.1], [2.25, 2.8], [1.5, 3.3], [0, 3.5]]; // [x, z]
  const frontX = (z) => { for (let i = 1; i < FRONT.length; i++) { const [x0, z0] = FRONT[i - 1], [x1, z1] = FRONT[i];
    if (z <= z1) return x0 + (x1 - x0) * (z - z0) / (z1 - z0); } return 0; };
  // The nose starts at the body end (its rounded edge reaches back to x = 0, no further) and is 4 cm narrower than the
  // body: overlapping coplanar faces there were z-fighting (the flicker by the windshield).
  function noseBand(z0, z1) {
    const bev = 0.3, nw = W - 0.04 - 2 * bev, sh = new THREE.Shape(), pts = FRONT.filter(([, z]) => z > z0 && z < z1);
    sh.moveTo(bev, z0); sh.lineTo(frontX(z0) - bev, z0);
    for (const [x, z] of pts) sh.lineTo(x - bev, z);
    sh.lineTo(Math.max(bev + 0.1, frontX(z1) - bev), z1); sh.lineTo(bev, z1); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: nw, bevelEnabled: true, bevelSize: bev, bevelThickness: bev, bevelSegments: 3, curveSegments: 6 });
    return g.applyMatrix4(new THREE.Matrix4().set(1, 0, 0, 0, 0, 0, -1, nw / 2, 0, 1, 0, 0, 0, 0, 0, 1)); // (x,y,z) -> (x, -z, y), centred
  }
  // The rounded bevel grows each band by 0.3 m, so the outer bands stop 0.3 m short to sit flush with floor and roof.
  const NOSE = [[noseBand(0.8, 1.45), red], [noseBand(1.45, 2.95), glass], [noseBand(2.95, 3.2), white]];
  const cache = {};
  // A train is a list of parts, each placed on the track on its own so the train bends through curves:
  // 4 cars (the end ones carry the cabs) and the articulation joints between them. x = part centre, metres from mid-train.
  function model(l) {
    const len = LEN[l.name], cars = 4, gap = 0.8, cl = (len - gap * (cars - 1)) / cars;
    // Overlays sit >= 4 cm apart (stripe < window band < swoosh) so they never fight for the same depth.
    const c = (cache[l.name] ||= { body: bodyGeo(cl), win: box(cl - 2, W + 0.08, 0.95), stripe: box(cl, W + 0.04, 0.28), swoosh: box(7, W + 0.14, 1.1),
      bellows: box(gap + 0.4, W - 0.3, TOP - BASE - 0.3), panto: box(5, 1.2, 0.4), line: mat(l.color) });
    const root = new THREE.Group(), parts = [];
    const part = (x) => { const g = new THREE.Group(); root.add(g); parts.push({ g, x }); return g; };
    for (let i = 0; i < cars; i++) {
      const g = part(-len / 2 + cl / 2 + i * (cl + gap));
      g.add(placed(c.body, white, 0, 0, 0));
      g.add(placed(c.win, glass, 0, 0, 2.55)); // window band
      g.add(placed(c.stripe, c.line, 0, 0, 1.3)); // line-colour stripe
      if (i === 1) g.add(placed(c.panto, grey, 0, 0, TOP + 0.2)); // pantograph
      if (i === 0 || i === cars - 1) { // a cab at both ends, like the real (double-ended) train
        const end = i === 0 ? -1 : 1, cab = new THREE.Group();
        for (const [geo, m] of NOSE) cab.add(new THREE.Mesh(geo, m));
        cab.add(placed(c.swoosh, red, -3.5, 0, 1.15)); // red maple-leaf swoosh behind the cab
        cab.position.x = end * cl / 2;
        cab.rotation.z = end > 0 ? 0 : Math.PI;
        g.add(cab);
      }
      if (i < cars - 1) part(-len / 2 + (i + 1) * (cl + gap) - gap / 2).add(placed(c.bellows, glass, 0, 0, (TOP + BASE) / 2)); // joint
    }
    return { root, parts };
  }
  let renderer;
  return {
    id: "trains-3d", type: "custom", renderingMode: "3d",
    onAdd(_, gl) { renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: gl, antialias: true }); renderer.autoClear = false; },
    render(gl, matrix) {
      if (!document.body.classList.contains("three")) return;
      const o = maplibregl.MercatorCoordinate.fromLngLat(map.getCenter()), u = o.meterInMercatorCoordinateUnits();
      camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix)
        .multiply(new THREE.Matrix4().makeTranslation(o.x, o.y, 0).scale(new THREE.Vector3(u, -u, u)));
      const mpp = 40075016 * Math.cos(45.4 * Math.PI / 180) / (512 * 2 ** map.getZoom()); // metres per pixel
      // Like the 2D sprites: at least ~55 px long. Real trains are 37x longer than wide, so also fatten the
      // cross-section (3x when zoomed out, true proportions from zoom 17) or they read as a thin line.
      const fat = Math.min(3, Math.max(1, 18 - map.getZoom()));
      for (const [k, tr] of trains) {
        if (tr.d == null) continue;
        let t3 = groups.get(k);
        if (!t3) { t3 = model(tr.l); scene.add(t3.root); groups.set(k, t3); }
        const sc = Math.max(1, 55 * mpp / LEN[tr.l.name]);
        for (const { g, x } of t3.parts) { // each car sits on the track at its own spot, facing along it
          const dd = tr.d + tr.sign * x * sc, p = pointAt(tr.l, dd), a = pointAt(tr.l, dd + tr.sign * 3), b = pointAt(tr.l, dd - tr.sign * 3);
          const m = maplibregl.MercatorCoordinate.fromLngLat(p);
          g.position.set((m.x - o.x) / u, -(m.y - o.y) / u, 0);
          g.rotation.z = Math.atan2((a[1] - b[1]) * KY, (a[0] - b[0]) * KX);
          g.scale.set(sc, sc * fat, sc * fat);
        }
      }
      for (const [k, t3] of groups) if (!trains.has(k)) { scene.remove(t3.root); groups.delete(k); }
      renderer.resetState();
      renderer.render(scene, camera);
    },
  };
}
