<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O-Train Live</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: "Open Sans", system-ui, sans-serif; color: #222; background: #f2efe9; }
  .card { position: absolute; z-index: 2; top: 12px; left: 12px; background: #fff; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 12px 14px; max-width: calc(100vw - 52px); }
  .card h1 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
  .legend > span { display: flex; align-items: center; gap: 5px; }
  .status { margin-top: 8px; font-size: 12px; color: #555; }
  .status.err { color: #b0101d; }
  .toggle { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; cursor: pointer; }
  .badge { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 16px;
    display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); box-sizing: border-box; }
  .legend .badge { width: 22px; height: 22px; font-size: 13px; }
  .stn { background: #fff; border: 2.5px solid #222; border-radius: 99px; box-sizing: border-box; }
  /* --len is set from the zoom level. */
  .train { width: var(--len, 34px); aspect-ratio: 100 / 24; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,.45)); cursor: pointer; }
  .train svg { display: block; width: 100%; height: 100%; }
  .dots .train { width: 16px; aspect-ratio: 1; border-radius: 50%; background: var(--c); border: 3px solid #fff;
    box-sizing: border-box; filter: none; box-shadow: 0 0 0 1.5px #222, 0 2px 5px rgba(0,0,0,.4); }
  .dots .train svg { display: none; }
  .maplibregl-popup { font-family: inherit; font-size: 13px; pointer-events: none; }
  .maplibregl-popup-content { padding: 6px 10px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="card">
  <h1>O-Train Live</h1>
  <div class="legend" id="legend"></div>
  <label class="toggle"><input type="checkbox" id="models" checked> Train models</label>
  <label class="toggle"><input type="checkbox" id="sat"> Satellite</label>
  <div class="status" id="status" role="status">Loading…</div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Worker URL (see README). ?feed=<url> overrides it for testing.
const FEED = new URLSearchParams(location.search).get("feed") || "https://otrain-feed.REPLACE_ME.workers.dev";
const POLL_MS = 15000, STALE_S = 300;
// ponytail: trains glide along the track between ~30s GPS fixes by dead reckoning at a typical speed.
// Looks alive, not exact. Per-segment speeds from the schedule would be the upgrade if accuracy matters.
const CRUISE = 11, DWELL_S = 20, MAX_EXTRAP_S = 120; // m/s (~40 km/h avg), station stop, give-up horizon

const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty",
  center: [-75.69, 45.37], zoom: 10.5, attributionControl: false });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
map.addControl(new maplibregl.AttributionControl({ customAttribution: "Data: OC Transpo", compact: true }));

// Trains grow a little as you zoom in, but stay a symbol (34–60 px), not to scale.
const sizeTrains = () => map.getContainer().style.setProperty("--len", `${Math.min(60, Math.max(34, 34 + (map.getZoom() - 12) * 8))}px`);
map.on("zoom", sizeTrains);
sizeTrains();

// Checkbox remembered per viewer; apply(on) runs now and on change.
const pref = (id, def, apply) => {
  const el = document.getElementById(id);
  try { const v = localStorage.getItem(id); if (v) el.checked = v === "1"; else el.checked = def; } catch { el.checked = def; }
  const go = () => { apply(el.checked); try { localStorage.setItem(id, el.checked ? "1" : "0"); } catch {} };
  el.addEventListener("change", go);
  return go;
};
pref("models", true, (on) => document.body.classList.toggle("dots", !on))();
const applySat = pref("sat", false, (on) => map.getLayer("sat") && map.setLayoutProperty("sat", "visibility", on ? "visible" : "none"));

// One shared hover popup for stations and trains.
const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
const hover = (el, getLngLat, getHtml) => {
  el.addEventListener("mouseenter", () => popup.setLngLat(getLngLat()).setHTML(getHtml()).addTo(map));
  el.addEventListener("mouseleave", () => popup.remove());
};

const byRoute = {};
const div = (cls, html = "") => Object.assign(document.createElement("div"), { className: cls, innerHTML: html });
const ll = ([la, lo]) => [lo, la];

Promise.all([fetch("lines.json").then((r) => r.json()), map.once("load")]).then(([lines]) => {
  // Satellite sits above the basemap's fills/roads but under its labels, so place names stay readable.
  map.addSource("sat", { type: "raster", tileSize: 256, maxzoom: 19, attribution: "Imagery &copy; Esri",
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"] });
  map.addLayer({ id: "sat", type: "raster", source: "sat", layout: { visibility: "none" } },
    map.getStyle().layers.find((x) => x.type === "symbol")?.id);
  applySat();
  for (const l of lines) {
    byRoute[l.route_id] = l;
    measure(l);
    map.addSource(l.route_id, { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: l.shape.map(ll) } } });
    map.addLayer({ id: l.route_id + "-casing", type: "line", source: l.route_id, layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#fff", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 16, 14] } });
    map.addLayer({ id: l.route_id, type: "line", source: l.route_id, layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": l.color, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4, 16, 9] } });
    document.getElementById("legend").insertAdjacentHTML("beforeend",
      `<span><span class="badge" style="background:${l.color}">${l.name}</span>Line ${l.name}</span>`);
  }
  for (const l of lines) l.stationD = l.stations.map((s) => project(l, s.lat, s.lon)).sort((a, b) => a - b);
  const seen = new Set();
  for (const l of lines) {
    for (const s of l.stations) {
      if (seen.has(s.name)) continue; // shared stations (Bayview, South Keys) drawn once
      seen.add(s.name);
      const el = div("stn");
      [el.style.width, el.style.height] = l.name === "1" ? ["24px", "11px"] : ["15px", "15px"]; // Line 1 pills, like OC Transpo's map
      new maplibregl.Marker({ element: el }).setLngLat([s.lon, s.lat]).addTo(map);
      hover(el, () => [s.lon, s.lat], () => s.name);
    }
    for (const end of [l.stations[0], l.stations.at(-1)]) {
      new maplibregl.Marker({ element: div("", `<div class="badge" style="background:${l.color}">${l.name}</div>`), offset: [0, -19] })
        .setLngLat([end.lon, end.lat]).addTo(map);
    }
  }
  const b = new maplibregl.LngLatBounds();
  lines.forEach((l) => l.shape.forEach((p) => b.extend(ll(p))));
  map.fitBounds(b, { padding: { top: 60, bottom: 30, left: 30, right: 30 }, animate: false });
  poll();
  requestAnimationFrame(frame);
});

// Track geometry: flat-earth metres are plenty at city scale.
const KX = 111320 * Math.cos(45.4 * Math.PI / 180), KY = 110540;
function measure(l) {
  l.xy = l.shape.map(([la, lo]) => [lo * KX, la * KY]);
  l.cum = [0];
  for (let i = 1; i < l.xy.length; i++) l.cum.push(l.cum[i - 1] + Math.hypot(l.xy[i][0] - l.xy[i - 1][0], l.xy[i][1] - l.xy[i - 1][1]));
  l.length = l.cum.at(-1);
}
function project(l, lat, lon) { // -> distance along the line of the nearest point
  const px = lon * KX, py = lat * KY;
  let best = Infinity, d = 0;
  for (let i = 1; i < l.xy.length; i++) {
    const [ax, ay] = l.xy[i - 1], [bx, by] = l.xy[i], dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
    const e = (ax + t * dx - px) ** 2 + (ay + t * dy - py) ** 2;
    if (e < best) { best = e; d = l.cum[i - 1] + t * (l.cum[i] - l.cum[i - 1]); }
  }
  return d;
}
function pointAt(l, d) { // -> [lon, lat]
  let i = 1;
  while (i < l.cum.length - 1 && l.cum[i] < d) i++;
  const t = (d - l.cum[i - 1]) / (l.cum[i] - l.cum[i - 1] || 1), [a, b] = [l.shape[i - 1], l.shape[i]];
  return [a[1] + t * (b[1] - a[1]), a[0] + t * (b[0] - a[0])];
}

// Top-down Citadis-ish train pointing right: white body, dark windshield + headlights up front, line-colour stripe.
const trainSvg = (c) => `<svg viewBox="0 0 100 24" aria-hidden="true">
  <path d="M5 2H82Q98 4 99 12Q98 20 82 22H5Q1 22 1 18V6Q1 2 5 2Z" fill="#fff" stroke="#2b2b2b" stroke-width="1"/>
  <path d="M86 4.6Q96.5 6.5 97 12Q96.5 17.5 86 19.4Q89.5 12 86 4.6Z" fill="#1d232b"/>
  <path d="M74 2.2Q82 2.6 86 4.6M74 21.8Q82 21.4 86 19.4" stroke="#d30f1d" stroke-width="2.2" fill="none"/>
  <circle cx="95" cy="7.5" r="1.3" fill="#ffd54a"/><circle cx="95" cy="16.5" r="1.3" fill="#ffd54a"/>
  <rect x="5" y="10.5" width="72" height="3" rx="1.5" fill="${c}"/>
  <path d="M26 2.5V21.5M50 2.5V21.5" stroke="#555" stroke-width="1"/>
  <rect x="35" y="6" width="8" height="3" rx="1" fill="#9aa0a6"/><rect x="2.2" y="7" width="1.6" height="10" rx=".8" fill="#d30f1d"/>
</svg>`;

const trains = new Map(); // vehicle id -> { l, marker, d (shown), d0 (fix), t0, sign, speed, dwell, info }

async function poll() {
  const status = document.getElementById("status");
  try {
    const r = await fetch(FEED, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const { vehicles } = await r.json();
    const now = Date.now() / 1000;
    const live = vehicles.filter((v) => byRoute[v.route_id] && (!v.timestamp || now - v.timestamp < STALE_S));
    const ids = new Set();
    for (const v of live) {
      const l = byRoute[v.route_id], id = v.id || v.trip_id;
      ids.add(id);
      const d0 = project(l, v.lat, v.lon);
      let tr = trains.get(id);
      if (!tr || tr.l !== l) {
        if (tr) tr.marker.remove();
        const el = div("train", trainSvg(l.color));
        el.style.setProperty("--c", l.color);
        el.title = `Line ${l.name} train`;
        // subpixelPositioning: no 1px stepping when a train crawls across the screen at city zoom.
        tr = { l, d: d0, marker: new maplibregl.Marker({ element: el, rotationAlignment: "map", pitchAlignment: "map", subpixelPositioning: true })
          .setLngLat(pointAt(l, d0)).addTo(map) };
        const t = tr;
        hover(el, () => t.marker.getLngLat(), () => t.info);
        trains.set(id, tr);
      }
      // Shape follows direction 0, so direction 0 runs toward increasing distance.
      if (v.timestamp || tr.d0 !== d0) tr.t0 = v.timestamp || now; // feeds without timestamps: restart only on a new fix
      Object.assign(tr, { d0, sign: v.direction_id === 1 ? -1 : 1,
        speed: v.speed > 1 ? v.speed : CRUISE, dwell: v.status === "STOPPED_AT" ? DWELL_S : 0 });
      const to = l.headsigns[v.direction_id] || "";
      const stop = l.stop_names[v.stop_id];
      const where = stop && (v.status === "STOPPED_AT" ? `At ${stop}` : `Next: ${stop}`);
      tr.info = [`<b>Line ${l.name}</b>${to ? ` → ${to}` : ""}`, where, `Train ${v.label || v.id || "?"}`].filter(Boolean).join("<br>");
    }
    for (const [id, tr] of trains) if (!ids.has(id)) { tr.marker.remove(); trains.delete(id); }
    status.className = "status";
    status.textContent = `${live.length} train${live.length === 1 ? "" : "s"} running · updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
  } catch (e) {
    status.className = "status err";
    status.textContent = `Live data unavailable (${e.message}). Retrying…`;
  }
  setTimeout(poll, POLL_MS);
}

let last = performance.now();
function frame(t) {
  const dt = Math.min((t - last) / 1000, 1), now = Date.now() / 1000;
  last = t;
  for (const tr of trains.values()) {
    const moving = Math.min(Math.max(0, now - tr.t0 - tr.dwell), MAX_EXTRAP_S);
    // Never run past the next station ahead of the last fix: the train pulls in and waits there for a fresh fix.
    const ahead0 = tr.d0 + tr.sign * 40;
    const next = tr.sign > 0 ? tr.l.stationD.find((x) => x > ahead0) ?? tr.l.length : tr.l.stationD.findLast((x) => x < ahead0) ?? 0;
    const est = tr.d0 + tr.sign * tr.speed * moving;
    const target = tr.sign > 0 ? Math.min(est, next) : Math.max(est, next);
    // Ease toward the estimate so new fixes slide in instead of teleporting; snap if way off.
    // A fix slightly behind the estimate means the train was slower than guessed: wait rather than reverse.
    const delta = target - tr.d;
    if (Math.abs(delta) > 2000) tr.d = target;
    else if (delta * tr.sign > 0 || Math.abs(delta) > 500) tr.d += delta * Math.min(1, dt * 2);
    const here = pointAt(tr.l, tr.d), ahead = pointAt(tr.l, tr.d + tr.sign * 30);
    tr.marker.setLngLat(here);
    // Sprite points east; marker rotation is clockwise from north.
    const dx = (ahead[0] - here[0]) * KX, dy = (ahead[1] - here[1]) * KY;
    if (dx || dy) tr.marker.setRotation(Math.atan2(dx, dy) * 180 / Math.PI - 90);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
